# Weekly and grouped, so updates come as a few PRs, each through Check like any other.
version: 2
updates:
  # The pnpm workspace: Dependabot reads pnpm-lock.yaml at the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch together.
      minor-and-patch:
        update-types: [minor, patch]
      # Majors together too, in one PR of their own: they often need each other
      # (vite and its plugins) and are landed together after reading each changelog.
      majors:
        update-types: [major]
  # The SHA-pinned actions in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
