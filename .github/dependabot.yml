# Weekly and grouped, so updates come as a few PRs, each through Check like any other.
version: 2
updates:
  # The pnpm workspace: Dependabot reads pnpm-lock.yaml at the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch together.
      minor-and-patch:
        update-types: [minor, patch]
    # No version PRs for npm majors: each is a migration, taken on purpose when it pays
    # (its own PR, after reading the changelog). Security updates still come for them.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # The SHA-pinned actions in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
