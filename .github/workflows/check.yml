name: Check
# Deploys live here too, so nothing reaches Fly before the checks pass.
on:
  pull_request:
  push:
    branches: [master]
  # Redeploy without a change (a lost machine, a rotated secret). Runs the checks first.
  workflow_dispatch:
    inputs:
      deploy:
        description: What to deploy
        type: choice
        options: [both, pb, mcp]
        default: both
permissions:
  contents: read
# A new push to a PR supersedes its running check; master runs are never cancelled
# (a cancelled check would skip its deploy).
concurrency:
  group: check-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    # About three minutes; a hung test must not hold the runner (and the deploy) for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-ui compares against the merge base with master.
          fetch-depth: 0
      # Takes its version from package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The scripts' own tests (check-ui's rules among them).
      - run: node --test scripts/*.test.mjs
      # UI rules on the lines this change adds (CODING_STANDARDS.md § UI, ADR 0079).
      - run: node scripts/check-ui.mjs
        env:
          CHECK_UI_BASE: origin/${{ github.base_ref || 'master' }}
      # No ADR number twice; warns when another branch holds a number this change adds.
      - run: node scripts/adr.mjs check
        env:
          ADR_BASE: origin/${{ github.base_ref || 'master' }}
      # No migration number twice, and new ones after the base's newest (prod migrates on boot).
      - run: node scripts/migrations.mjs check
        env:
          MIGRATIONS_BASE: origin/${{ github.base_ref || 'master' }}
      - run: pnpm -r typecheck
      # No unused dependency, file or export (knip.jsonc).
      - run: pnpm knip
      - run: pnpm -r test
      # Again on a French desk west of UTC: no test may lean on the runner's
      # English locale or UTC clock. The full e2e suite is too slow for here: it runs
      # nightly (e2e.yml) and on an integration PR; e2e-changed below runs the specs
      # this PR touches.
      - run: pnpm -r test
        env:
          LANG: fr_FR.UTF-8
          LC_ALL: fr_FR.UTF-8
          TZ: America/Los_Angeles

  # Which e2e cases this PR runs, and on how many runners. A PR runs the specs it adds or
  # changes, three times each so a flaky one shows here rather than in the nightly run.
  # An integration PR (pnpm integrate, ADR 0096) runs the whole suite once: it is the
  # gate before master, and the only run that sees the batch's PRs together.
  e2e-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.plan.outputs.run }}
      files: ${{ steps.plan.outputs.files }}
      projects: ${{ steps.plan.outputs.projects }}
      repeat: ${{ steps.plan.outputs.repeat }}
      retries: ${{ steps.plan.outputs.retries }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The spec files this PR adds or edits, and nothing else: --only-changed would also
      # pull in every spec importing a changed support file or the config, which can be
      # the whole suite; the nightly run and the integration PR cover that.
      - id: specs
        env:
          BASE: origin/${{ github.base_ref }}
          INTEGRATION: ${{ startsWith(github.head_ref, 'integration/') }}
        run: |
          if [ "$INTEGRATION" = true ]; then
            echo "Integration PR: the whole suite."
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "projects=" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "$BASE" HEAD)
          files=$(git diff --name-only --diff-filter=AMR "$base" HEAD -- 'shell/e2e/*.spec.ts' | sed 's#^shell/e2e/##' | tr '\n' ' ')
          echo "$files"
          if [ -z "${files// }" ]; then
            echo "No e2e spec changed; nothing to run."
            echo "none=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          # The two Demo builds only when a Demo spec moved (playwright.config.ts).
          if grep -q 'demo\.' <<<"$files"; then
            echo "projects=" >> "$GITHUB_OUTPUT"
          else
            echo "projects=--project=mobile --project=desktop" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.specs.outputs.none != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.specs.outputs.none != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.specs.outputs.none != 'true'
        run: pnpm install --frozen-lockfile
      # Each changed case three times, no retries: a case that needs one is the flake this
      # job is here to catch. Past 150 cases (an edit to screens.spec) once, on four
      # runners; below that one runner, since each pays about three minutes of setup.
      # The whole suite (integration PR) runs once on four runners, with the config's retry.
      - id: plan
        if: steps.specs.outputs.none != 'true'
        working-directory: shell
        env:
          FILES: ${{ steps.specs.outputs.files }}
          PROJECTS: ${{ steps.specs.outputs.projects }}
          FULL: ${{ steps.specs.outputs.full }}
        run: |
          cases=$(pnpm exec playwright test --list $FILES $PROJECTS | sed -n 's/^Total: \([0-9]*\) test.*/\1/p')
          if [ "$FULL" = true ]; then repeat=1; retries=; shards='[1,2,3,4]'
          elif [ "$cases" -gt 150 ]; then repeat=1; retries=--retries=0; shards='[1,2,3,4]'
          else repeat=3; retries=--retries=0; shards='[1]'
          fi
          echo "$cases cases, each run $repeat time(s), on shards $shards"
          {
            echo "run=true"
            echo "files=$FILES"
            echo "projects=$PROJECTS"
            echo "repeat=$repeat"
            echo "retries=$retries"
            echo "shards=$shards"
          } >> "$GITHUB_OUTPUT"

  e2e-changed:
    needs: e2e-plan
    if: needs.e2e-plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.e2e-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium keyed on the Playwright version, so a run downloads it only after a bump.
      - id: playwright
        run: echo "version=$(node -p "require('./shell/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Still run on a cache hit: --with-deps installs the system libraries.
      - run: pnpm --filter @lifeline/shell exec playwright install --with-deps chromium
      # Each shard runs the setup projects (seed, demo-setup) its cases depend on.
      - working-directory: shell
        run: pnpm exec playwright test $FILES $PROJECTS --repeat-each=$REPEAT $RETRIES --shard=$SHARD/$TOTAL
        env:
          FILES: ${{ needs.e2e-plan.outputs.files }}
          PROJECTS: ${{ needs.e2e-plan.outputs.projects }}
          REPEAT: ${{ needs.e2e-plan.outputs.repeat }}
          RETRIES: ${{ needs.e2e-plan.outputs.retries }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-changed-${{ matrix.shard }}
          path: shell/playwright-report
          retention-days: 14

  # What this push changed, so each app deploys only when its code moved.
  changes:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      pb: ${{ steps.diff.outputs.pb }}
      mcp: ${{ steps.diff.outputs.mcp }}
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff reaches back to the push's previous master.
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.deploy }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$FORCE" in
              pb) pb=true; mcp=false ;;
              mcp) pb=false; mcp=true ;;
              *) pb=true; mcp=true ;;
            esac
            # Nothing to compare against: snapshot anyway, it is cheap.
            migrations=$pb
          elif [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # A new branch or a force-push: the previous master is unknown, so deploy everything.
            echo "No usable previous commit ('$BEFORE'); deploying everything."
            pb=true; mcp=true; migrations=true
          else
            files=$(git diff --name-only "$BEFORE" "$SHA")
            echo "$files"
            pb=false; mcp=false; migrations=false
            if grep -q '^pocketbase/' <<<"$files"; then pb=true; fi
            if grep -q '^pocketbase/pb_migrations/' <<<"$files"; then migrations=true; fi
            # The MCP server bundles the packages and apps, and reads the schema the migrations make.
            if grep -qE '^(mcp/|packages/|apps/|pnpm-lock\.yaml$|pocketbase/pb_migrations/)' <<<"$files"; then mcp=true; fi
          fi
          echo "pb=$pb mcp=$mcp migrations=$migrations"
          {
            echo "pb=$pb"
            echo "mcp=$mcp"
            echo "migrations=$migrations"
          } >> "$GITHUB_OUTPUT"

  deploy-pb:
    needs: [check, changes]
    if: needs.changes.outputs.pb == 'true'
    runs-on: ubuntu-latest
    # Holds FLY_API_TOKEN (deploy token scoped to lifeline-pb); usable from master only.
    environment: fly
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a commit: a moved tag or branch must not get the Fly token.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # PocketBase migrates on boot and prod has no staging: snapshot the volume first
      # when this push brings a migration, so a bad one can be rolled back. No snapshot,
      # no deploy.
      - name: Snapshot pb_data before a migration
        run: |
          if [ "$MIGRATIONS" != true ]; then
            echo "No migration in this push; no snapshot."
            exit 0
          fi
          vol=$(flyctl volumes list -a lifeline-pb --json | jq -r '.[] | select(.name == "pb_data") | .id')
          test -n "$vol"
          flyctl volumes snapshots create "$vol" -a lifeline-pb
        env:
          MIGRATIONS: ${{ needs.changes.outputs.migrations }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only --strategy immediate
        working-directory: pocketbase
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # A deploy that boots but fails its migrations is down; say so here, not when the app breaks.
      - name: Health check
        run: |
          end=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$end" ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://lifeline-pb.fly.dev/api/health || true)
            if [ "$code" = 200 ]; then echo "PocketBase is healthy."; exit 0; fi
            echo "Not yet: HTTP $code"
            sleep 5
          done
          echo "::error::PocketBase is not healthy after the deploy. Find the last good image with 'flyctl releases -a lifeline-pb --image' and redeploy it with 'flyctl deploy -a lifeline-pb --image <ref>'; if this push migrated, restore the pb_data snapshot taken above."
          exit 1

  # The MCP server (ADR 0062), after PocketBase so a new migration is live
  # before the tools that need it. Built from the repository root.
  deploy-mcp:
    needs: [check, changes, deploy-pb]
    # Runs when PocketBase deployed or had nothing to deploy, never after it failed.
    if: >-
      !cancelled()
      && needs.check.result == 'success'
      && needs.changes.outputs.mcp == 'true'
      && (needs.deploy-pb.result == 'success' || needs.deploy-pb.result == 'skipped')
    runs-on: ubuntu-latest
    environment: fly
    concurrency: deploy-mcp-group
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - run: flyctl deploy . --config mcp/fly.toml --remote-only --ha=false
        env:
          # Deploy token scoped to lifeline-mcp alone: fly tokens create deploy -a lifeline-mcp
          FLY_API_TOKEN: ${{ secrets.FLY_MCP_API_TOKEN }}
      # /mcp answers 401 without a token only when the server is up and its auth is wired.
      - name: Health check
        run: |
          end=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$end" ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST \
              -H 'Content-Type: application/json' -d '{}' https://lifeline-mcp.fly.dev/mcp || true)
            if [ "$code" = 401 ]; then echo "MCP server is up."; exit 0; fi
            echo "Not yet: HTTP $code"
            sleep 5
          done
          echo "::error::The MCP server did not answer 401 after the deploy. Find the last good image with 'flyctl releases -a lifeline-mcp --image' and redeploy it with 'flyctl deploy . --config mcp/fly.toml --image <ref>'."
          exit 1
