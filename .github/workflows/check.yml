name: Check
# Deploys live here too, so nothing reaches Fly before the checks pass.
on:
  pull_request:
  push:
    branches: [master]
  # Redeploy without a change (a lost machine, a rotated secret). Runs the checks first.
  workflow_dispatch:
    inputs:
      deploy:
        description: What to deploy
        type: choice
        options: [both, pb, mcp]
        default: both
permissions:
  contents: read
# A new push to a PR supersedes its running check; master runs are never cancelled
# (a cancelled check would skip its deploy).
concurrency:
  group: check-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-ui compares against the merge base with master.
          fetch-depth: 0
      # Takes its version from package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The scripts' own tests (check-ui's rules among them).
      - run: node --test scripts/*.test.mjs
      # UI rules on the lines this change adds (CODING_STANDARDS.md § UI, ADR 0079).
      - run: node scripts/check-ui.mjs
        env:
          CHECK_UI_BASE: origin/${{ github.base_ref || 'master' }}
      # No ADR number twice; warns when another branch holds a number this change adds.
      - run: node scripts/adr.mjs check
        env:
          ADR_BASE: origin/${{ github.base_ref || 'master' }}
      # No migration number twice, and new ones after the base's newest (prod migrates on boot).
      - run: node scripts/migrations.mjs check
        env:
          MIGRATIONS_BASE: origin/${{ github.base_ref || 'master' }}
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # Again on a French desk west of UTC: no test may lean on the runner's
      # English locale or UTC clock. The full e2e suite is too slow for here: it runs
      # nightly (e2e.yml), and e2e-changed below runs the specs this PR touches.
      - run: pnpm -r test
        env:
          LANG: fr_FR.UTF-8
          LC_ALL: fr_FR.UTF-8
          TZ: America/Los_Angeles

  # The e2e specs this PR adds or changes, three times each so a flaky one shows
  # here rather than in the nightly run (e2e.yml runs the whole suite).
  e2e-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # --only-changed diffs against the merge base with the PR's base branch.
          fetch-depth: 0
      - id: specs
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          base=$(git merge-base "$BASE" HEAD)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          changed=$(git diff --name-only "$base" HEAD -- shell/e2e)
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "No e2e spec changed; nothing to run."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          # The two Demo builds only when a Demo spec moved (playwright.config.ts).
          if grep -q 'demo\.' <<<"$changed"; then
            echo "projects=" >> "$GITHUB_OUTPUT"
          else
            echo "projects=--project=mobile --project=desktop" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.specs.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.specs.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.specs.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.specs.outputs.run == 'true'
        run: pnpm --filter @lifeline/shell exec playwright install --with-deps chromium
      # No retries: a case that needs one is the flake this job is here to catch.
      - if: steps.specs.outputs.run == 'true'
        run: pnpm --filter @lifeline/shell test:e2e --only-changed="$BASE_SHA" --repeat-each=3 --retries=0 --pass-with-no-tests $PROJECTS
        env:
          BASE_SHA: ${{ steps.specs.outputs.base }}
          PROJECTS: ${{ steps.specs.outputs.projects }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-changed
          path: shell/playwright-report
          retention-days: 14

  # What this push changed, so each app deploys only when its code moved.
  changes:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      pb: ${{ steps.diff.outputs.pb }}
      mcp: ${{ steps.diff.outputs.mcp }}
      migrations: ${{ steps.diff.outputs.migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff reaches back to the push's previous master.
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.deploy }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$FORCE" in
              pb) pb=true; mcp=false ;;
              mcp) pb=false; mcp=true ;;
              *) pb=true; mcp=true ;;
            esac
            # Nothing to compare against: snapshot anyway, it is cheap.
            migrations=$pb
          elif [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # A new branch or a force-push: the previous master is unknown, so deploy everything.
            echo "No usable previous commit ('$BEFORE'); deploying everything."
            pb=true; mcp=true; migrations=true
          else
            files=$(git diff --name-only "$BEFORE" "$SHA")
            echo "$files"
            pb=false; mcp=false; migrations=false
            if grep -q '^pocketbase/' <<<"$files"; then pb=true; fi
            if grep -q '^pocketbase/pb_migrations/' <<<"$files"; then migrations=true; fi
            # The MCP server bundles the packages and apps, and reads the schema the migrations make.
            if grep -qE '^(mcp/|packages/|apps/|pnpm-lock\.yaml$|pocketbase/pb_migrations/)' <<<"$files"; then mcp=true; fi
          fi
          echo "pb=$pb mcp=$mcp migrations=$migrations"
          {
            echo "pb=$pb"
            echo "mcp=$mcp"
            echo "migrations=$migrations"
          } >> "$GITHUB_OUTPUT"

  deploy-pb:
    needs: [check, changes]
    if: needs.changes.outputs.pb == 'true'
    runs-on: ubuntu-latest
    # Holds FLY_API_TOKEN (deploy token scoped to lifeline-pb); usable from master only.
    environment: fly
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a commit: a moved tag or branch must not get the Fly token.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # PocketBase migrates on boot and prod has no staging: snapshot the volume first
      # when this push brings a migration, so a bad one can be rolled back. No snapshot,
      # no deploy.
      - name: Snapshot pb_data before a migration
        run: |
          if [ "$MIGRATIONS" != true ]; then
            echo "No migration in this push; no snapshot."
            exit 0
          fi
          vol=$(flyctl volumes list -a lifeline-pb --json | jq -r '.[] | select(.name == "pb_data") | .id')
          test -n "$vol"
          flyctl volumes snapshots create "$vol" -a lifeline-pb
        env:
          MIGRATIONS: ${{ needs.changes.outputs.migrations }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only --strategy immediate
        working-directory: pocketbase
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # A deploy that boots but fails its migrations is down; say so here, not when the app breaks.
      - name: Health check
        run: |
          end=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$end" ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://lifeline-pb.fly.dev/api/health || true)
            if [ "$code" = 200 ]; then echo "PocketBase is healthy."; exit 0; fi
            echo "Not yet: HTTP $code"
            sleep 5
          done
          echo "::error::PocketBase is not healthy after the deploy. Find the last good image with 'flyctl releases -a lifeline-pb --image' and redeploy it with 'flyctl deploy -a lifeline-pb --image <ref>'; if this push migrated, restore the pb_data snapshot taken above."
          exit 1

  # The MCP server (ADR 0062), after PocketBase so a new migration is live
  # before the tools that need it. Built from the repository root.
  deploy-mcp:
    needs: [check, changes, deploy-pb]
    # Runs when PocketBase deployed or had nothing to deploy, never after it failed.
    if: >-
      !cancelled()
      && needs.check.result == 'success'
      && needs.changes.outputs.mcp == 'true'
      && (needs.deploy-pb.result == 'success' || needs.deploy-pb.result == 'skipped')
    runs-on: ubuntu-latest
    environment: fly
    concurrency: deploy-mcp-group
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - run: flyctl deploy . --config mcp/fly.toml --remote-only --ha=false
        env:
          # Deploy token scoped to lifeline-mcp alone: fly tokens create deploy -a lifeline-mcp
          FLY_API_TOKEN: ${{ secrets.FLY_MCP_API_TOKEN }}
      # /mcp answers 401 without a token only when the server is up and its auth is wired.
      - name: Health check
        run: |
          end=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$end" ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST \
              -H 'Content-Type: application/json' -d '{}' https://lifeline-mcp.fly.dev/mcp || true)
            if [ "$code" = 401 ]; then echo "MCP server is up."; exit 0; fi
            echo "Not yet: HTTP $code"
            sleep 5
          done
          echo "::error::The MCP server did not answer 401 after the deploy. Find the last good image with 'flyctl releases -a lifeline-mcp --image' and redeploy it with 'flyctl deploy . --config mcp/fly.toml --image <ref>'."
          exit 1
