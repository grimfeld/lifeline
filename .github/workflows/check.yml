name: Check
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-ui compares against the merge base with master.
          fetch-depth: 0
      # Takes its version from package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # UI rules on the lines this change adds (CODING_STANDARDS.md § UI, ADR 0079).
      - run: node scripts/check-ui.mjs
        env:
          CHECK_UI_BASE: origin/${{ github.base_ref || 'master' }}
      # No ADR number twice; warns when another branch holds a number this change adds.
      - run: node scripts/adr.mjs check
        env:
          ADR_BASE: origin/${{ github.base_ref || 'master' }}
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # Again on a French desk west of UTC: no test may lean on the runner's
      # English locale or UTC clock. No e2e here — too slow (CLAUDE.md, ADR 0065).
      - run: pnpm -r test
        env:
          LANG: fr_FR.UTF-8
          LC_ALL: fr_FR.UTF-8
          TZ: America/Los_Angeles
