name: Layout tests
# Every screen at phone and desktop width over long content (ADR 0065).
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @lifeline/shell exec playwright install --with-deps chromium
      - name: Run layout tests
        run: pnpm --filter @lifeline/shell exec playwright test --project=${{ matrix.project }} --workers=4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            shell/playwright-report/
            shell/test-results/
          retention-days: 14
