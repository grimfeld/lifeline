name: E2E
# The whole suite, each night on master (ADR 0129): the delivery gate's projects (desktop,
# mobile) and the nightly-only ones, the UI checks (screens, a11y-names, ADR 0065) and the
# Demo (ADR 0077). A red run does not block delivery: it opens, or comments on, a
# ready-for-agent issue for the night shift.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      specs:
        description: Spec files to run (e.g. "people.spec.ts"); empty runs the whole suite
        type: string
        default: ""
permissions:
  contents: read
jobs:
  # The Playwright version the runners' image carries: @playwright/test's exact version,
  # read here as e2e-runners.yml's e2e-plan reads it, so a Playwright bump moves both workflows.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: echo "version=$(node -p "require('./shell/package.json').devDependencies['@playwright/test'].replace(/^[\\^~]/, '')")" >> "$GITHUB_OUTPUT"

  e2e:
    needs: playwright
    runs-on: ubuntu-latest
    # The gate's image (ADR 0134): its Chromium and system libraries come with it, so the
    # nightly run tests in the same OS image as delivery, and pays no apt install.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    timeout-minutes: 60
    # Four runners, each with its own setup projects (seed, demo-setup): the whole suite
    # on one takes about half an hour. `--shard` splits by count, not recorded time: the UI checks
    # and the Demo have no recorded times (ADR 0134). An approved PR runs the gate in check.yml.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Takes its version from package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every project: no --project, so the Demo builds start too (playwright.config.ts).
      - run: pnpm --filter @lifeline/shell test:e2e $SPECS --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          SPECS: ${{ inputs.specs }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: shell/playwright-report
          retention-days: 14
      # The failing cases, for the issue below.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: shell/e2e-results.json
          retention-days: 14
          if-no-files-found: ignore

  # A red run is work for the night shift, not a block on delivery (ADR 0129): one open
  # issue labelled ready-for-agent names the failing specs and cases and links the run.
  # While it is open, each later red run comments on it instead of opening another.
  report:
    needs: e2e
    if: always() && needs.e2e.result == 'failure'
    # One report at a time, so two red runs can't both find no issue and open two.
    concurrency: nightly-e2e-report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or comment on the nightly e2e issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Nightly e2e run is red"
        run: |
          # The shards' json reports (none when a shard broke before its tests ran).
          gh run download "$RUN_ID" --pattern 'e2e-results-*' --dir results || true
          node scripts/e2e-failures.mjs "$RUN_URL" $(find results -name e2e-results.json 2>/dev/null) > body.md
          cat body.md
          open=$(gh issue list --state open --label ready-for-agent --search "in:title \"$TITLE\"" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file body.md
          else
            { cat body.md; echo; echo "Fix the cases (or the code they caught), and close this issue with the PR. Each red night while it is open comments here."; } > issue.md
            gh issue create --title "$TITLE" --label ready-for-agent --body-file issue.md
          fi
