name: E2E
# The screens test (ADR 0065) is too slow for every PR, so it runs on master each
# night: a screen that breaks goes red within a day, not when the next agent trips on it.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Takes its version from package.json's packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lifeline/shell exec playwright install --with-deps chromium
      - run: pnpm --filter @lifeline/shell test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: shell/playwright-report
          retention-days: 14
