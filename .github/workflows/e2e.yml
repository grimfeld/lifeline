name: E2E
# The screens test (ADR 0065) is too slow for every PR, so it runs on master each
# night: a screen that breaks goes red within a day, not when the next agent trips on it.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Four runners, each with its own setup projects (seed, demo-setup): the whole suite
    # on one takes about half an hour. An integration PR runs it the same way (check.yml).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Takes its version from package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium keyed on the Playwright version, so a run downloads it only after a bump.
      - id: playwright
        run: echo "version=$(node -p "require('./shell/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Still run on a cache hit: --with-deps installs the system libraries.
      - run: pnpm --filter @lifeline/shell exec playwright install --with-deps chromium
      - run: pnpm --filter @lifeline/shell test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: shell/playwright-report
          retention-days: 14
