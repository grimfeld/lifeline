name: Deploy to Fly
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --strategy immediate
        working-directory: pocketbase
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  # The MCP server (ADR 0062), after PocketBase so a new migration is live
  # before the tools that need it. Built from the repository root.
  deploy-mcp:
    needs: deploy
    runs-on: ubuntu-latest
    concurrency: deploy-mcp-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy . --config mcp/fly.toml --remote-only --ha=false
        env:
          # Deploy token scoped to lifeline-mcp alone: fly tokens create deploy -a lifeline-mcp
          FLY_API_TOKEN: ${{ secrets.FLY_MCP_API_TOKEN }}
