<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lifeline options</title>
    <style>
      :root { color-scheme: light dark; --fg: #1f1f1f; --muted: #666; --bg: #fff; --border: #d4d4d4; --error: #b42318; }
      @media (prefers-color-scheme: dark) { :root { --fg: #ececec; --muted: #a3a3a3; --bg: #1f1f1f; --border: #404040; --error: #f97066; } }
      body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; min-width: 320px; }
      form { display: grid; gap: 8px; max-width: 480px; }
      label { font-weight: 500; }
      input { font: inherit; color: inherit; background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; min-width: 0; }
      input[aria-invalid="true"] { border-color: var(--error); }
      .hint, #status { color: var(--muted); margin: 0; overflow-wrap: anywhere; }
      #status.error { color: var(--error); }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: inherit; cursor: pointer; }
      button[type="submit"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    </style>
  </head>
  <body>
    <form id="form" novalidate>
      <label for="url">Lifeline URL</label>
      <input id="url" type="url" inputmode="url" spellcheck="false" autocomplete="off" aria-describedby="hint status" />
      <p class="hint" id="hint">Where Send to Lifeline opens the Handoff page. Change it only if you run your own Lifeline.</p>
      <div class="row">
        <button type="submit">Save</button>
        <button type="button" id="reset">Use the default</button>
      </div>
      <p id="status" role="status"></p>
    </form>
    <script src="options.js"></script>
  </body>
</html>
