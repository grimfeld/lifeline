# fly.toml app configuration file generated for lifeline-pb on 2026-08-17T19:30:55+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

# Secrets: MCP_SERVICE_EMAIL / MCP_SERVICE_PASSWORD (the MCP server's account,
# kept at each start by pb_hooks/mcp_service.pb.js, #263), and PB_ADMIN_PRIVATE=1
# to refuse the admin UI and superuser sign-in from the internet (#258); admin
# work then goes through `fly proxy 8080 -a lifeline-pb` and http://localhost:8080/_/.

app = 'lifeline-pb'
primary_region = 'fra'

[build]
[[mounts]]
  source = 'pb_data'
  destination = '/pb/pb_data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
